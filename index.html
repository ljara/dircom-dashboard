<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Dirección de Comunicaciones</title>
<style>
  :root {
    --purple:#7F77DD;--purple-dark:#534AB7;--purple-light:#EEEDFE;
    --blue:#378ADD;--amber:#EF9F27;--red:#E24B4A;--green:#639922;--gray:#888780;
    --red-light:#FCEBEB;--amber-light:#FAEEDA;--green-light:#EAF3DE;--gray-light:#F1EFE8;--blue-light:#E6F1FB;
    --bg:#F8F8F6;--surface:#FFFFFF;
    --border:rgba(0,0,0,0.09);--border-md:rgba(0,0,0,0.16);
    --text:#1a1a1a;--text-muted:#666;--text-faint:#999;
    --radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,0.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  /* Sidebar */
  .sidebar{position:fixed;top:0;left:0;width:224px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10}
  .sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
  .sidebar-logo .org{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
  .sidebar-logo .name{font-size:15px;font-weight:600}
  .sidebar-logo .sub{font-size:12px;color:var(--text-muted)}
  .sidebar-nav{padding:12px 10px;flex:1;overflow-y:auto}
  .nav-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);padding:6px 8px 4px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-muted);border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
  .nav-item:hover{background:var(--gray-light);color:var(--text)}
  .nav-item.active{background:var(--purple-light);color:var(--purple-dark);font-weight:500}
  .nav-item .icon{font-size:15px;width:20px;text-align:center}
  .nav-divider{height:1px;background:var(--border);margin:8px 0}
  .coord-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sync-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);padding:0 18px 14px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .sync-dot.syncing{background:var(--amber);animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* Main */
  .main{margin-left:224px;padding:28px 28px 40px;min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .page-title{font-size:20px;font-weight:600}
  .page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-md);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:background .12s;white-space:nowrap}
  .btn:hover{background:var(--gray-light)}
  .btn-primary{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn-primary:hover{background:var(--purple-dark);border-color:var(--purple-dark)}
  .btn-sm{padding:4px 10px;font-size:12px}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--text-muted)}
  .btn-ghost:hover{background:var(--gray-light);color:var(--text)}
  .btn-danger{color:var(--red);border-color:transparent;background:transparent}
  .btn-danger:hover{background:var(--red-light)}
  .btn-edit{color:var(--purple);border-color:transparent;background:transparent}
  .btn-edit:hover{background:var(--purple-light)}
  .btn-view{color:var(--blue);border-color:transparent;background:transparent}
  .btn-view:hover{background:rgba(55,138,221,.1)}
  /* Vista detallada de tarea */
  .task-detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
  .task-detail-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .task-detail-title{font-size:17px;font-weight:600;line-height:1.3;margin-bottom:6px}
  .task-detail-coord{font-size:13px;color:var(--text-muted)}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .detail-field{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px}
  .detail-field .d-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px}
  .detail-field .d-value{font-size:13px;font-weight:500;color:var(--text)}
  .detail-desc{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px}
  .detail-desc .d-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:6px}
  .detail-desc .d-value{font-size:13px;color:var(--text);line-height:1.6}
  .detail-extras{margin-top:4px}
  .detail-extras .d-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:8px}
  .task-title-link{cursor:pointer;text-decoration:none;color:inherit}
  .task-title-link:hover{color:var(--purple);text-decoration:underline}
  /* Metrics */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .metric .m-label{font-size:11px;color:var(--text-faint);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .metric .m-value{font-size:26px;font-weight:700;line-height:1}
  .metric .m-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
  /* Cards */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:24px}
  .coord-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .coord-card:hover{border-color:var(--border-md);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
  .coord-card.active{border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
  .coord-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .coord-icon-wrap{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .coord-card-name{font-size:13px;font-weight:600}
  .coord-card-jefe{font-size:11px;color:var(--text-muted);margin-top:1px}
  .coord-stats{display:flex;gap:14px;font-size:12px;color:var(--text-muted);margin-bottom:10px}
  .prog-bar{height:4px;background:var(--gray-light);border-radius:2px;overflow:hidden}
  .prog-fill{height:100%;border-radius:2px;transition:width .4s ease}
  .prog-pct{font-size:11px;color:var(--text-faint);margin-top:4px;text-align:right}
  /* Layout */
  .two-col{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
  .section-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  /* Filters */
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
  .filter-pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border-md);background:transparent;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .12s}
  .filter-pill:hover{border-color:var(--purple);color:var(--purple)}
  .filter-pill.active{background:var(--purple-light);border-color:var(--purple);color:var(--purple-dark);font-weight:500}
  /* Tasks */
  .task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;transition:background .1s}
  .task-item:hover{background:var(--gray-light)}
  .task-item+.task-item{border-top:1px solid var(--border)}
  .task-status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
  .task-body{flex:1;min-width:0}
  .task-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .status-select{font-size:11px;border:1px solid var(--border-md);border-radius:4px;padding:2px 6px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit}
  /* Badges */
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
  .badge-alta{background:var(--red-light);color:#791F1F}
  .badge-media{background:var(--amber-light);color:#633806}
  .badge-baja{background:var(--green-light);color:#27500A}
  .dot-todo{background:var(--gray)}.dot-progress{background:var(--blue)}.dot-review{background:var(--amber)}.dot-done{background:var(--green)}
  /* Personas */
  .persona-item{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .persona-item+.persona-item{border-top:1px solid var(--border)}
  .persona-item:hover{background:var(--gray-light)}
  .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
  .persona-info{flex:1;min-width:0}
  .persona-name{font-size:13px;font-weight:500}
  .persona-role{font-size:11px;color:var(--text-muted)}
  /* Empty */
  .empty{text-align:center;padding:36px 20px;color:var(--text-muted)}
  .empty .empty-icon{font-size:32px;margin-bottom:10px}
  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);width:460px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal-header h2{font-size:16px;font-weight:600}
  .modal-body{padding:20px}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:5px;text-transform:capitalize}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border-md);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
  .form-group textarea{resize:vertical;min-height:68px}
  .field-extra{background:var(--gray-light);border-radius:var(--radius-sm);padding:2px 0;margin-bottom:2px}
  .field-extra label{color:var(--text-faint);font-style:italic}
  /* Toast & Spinner */
  .toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200}
  .loading-overlay p{font-size:14px;color:var(--text-muted)}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:16px}.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p>Cargando datos desde Google Sheets…</p>
</div>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="org">Universidad de La Frontera</div>
    <div class="name">Comunicaciones</div>
    <div class="sub" id="sidebar-rol">Panel de gestión</div>
  </div>
  <div style="padding:10px 12px 0">
    <div style="position:relative">
      <input id="sidebar-search" type="text" placeholder="Buscar tarea…"
        style="width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border-md);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg);color:var(--text)"
        oninput="onSidebarSearch(this.value)"
        onkeydown="if(event.key==='Escape'){this.value='';onSidebarSearch('')}">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none">🔍</span>
      <button id="search-clear" onclick="document.getElementById('sidebar-search').value='';onSidebarSearch('')"
        style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text-muted)">✕</button>
    </div>
    <div id="sidebar-search-results" style="display:none;margin-top:6px;max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow)"></div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-label">Vistas</div>
    <button class="nav-item active" id="nav-dashboard" onclick="setView('dashboard')"><span class="icon">⊞</span> Dashboard general</button>
    <button class="nav-item" id="nav-tareas" onclick="setView('tareas')"><span class="icon">☑</span> Todas las tareas</button>
    <button class="nav-item" id="nav-personas" onclick="setView('personas')"><span class="icon">👥</span> Equipo</button>
    <button class="nav-item" id="nav-coordinaciones" onclick="setView('coordinaciones')"><span class="icon">⚙</span> Coordinaciones</button>
    <button class="nav-item" id="nav-opciones" onclick="setView('opciones')"><span class="icon">🏷</span> Opciones</button>
    <button class="nav-item" id="nav-papelera" onclick="setView('papelera')"><span class="icon">🗑</span> Papelera</button>
    <div class="nav-divider"></div>
    <div class="nav-label">Coordinaciones</div>
    <div id="sidebar-coords"></div>
    <div class="nav-divider"></div>
    <button class="nav-item" onclick="openModal('tarea',null)"><span class="icon">＋</span> Nueva tarea</button>
    <button class="nav-item" onclick="openModal('persona',null)"><span class="icon">＋</span> Agregar persona</button>
  </div>
  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-text">Sincronizado</span>
    <button onclick="silentRefresh()" title="Actualizar ahora" style="margin-left:auto;border:none;background:transparent;cursor:pointer;font-size:14px;padding:0;color:var(--text-faint)" onmouseover="this.style.color='var(--purple)'" onmouseout="this.style.color='var(--text-faint)'">↻</button>
  </div>
</nav>

<main class="main" id="main-content"></main>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxGEYGNKU-vJg8R5SUsp1CpGdmWAVFSTW-CC2qekUujJPbEOP1V_UCzZLc_3WJ5_tmW/exec';

const PALETTE = [
  {hex:'#378ADD',bg:'rgba(55,138,221,.13)'},
  {hex:'#7F77DD',bg:'rgba(127,119,221,.13)'},
  {hex:'#1D9E75',bg:'rgba(29,158,117,.13)'},
  {hex:'#EF9F27',bg:'rgba(239,159,39,.13)'},
  {hex:'#D4537E',bg:'rgba(212,83,126,.13)'},
  {hex:'#D85A30',bg:'rgba(216,90,48,.13)'},
  {hex:'#5B8FA8',bg:'rgba(91,143,168,.13)'},
  {hex:'#7A9E3B',bg:'rgba(122,158,59,.13)'},
];

// Campos del sistema que no se muestran como campos extra editables
const SYSTEM_FIELDS_TAREA   = ['id','titulo','descripcion','coordId','asignado','status','prioridad','fecha','created','solicitante','tipo_requerimiento','categoria','link'];
const SYSTEM_FIELDS_PERSONA = ['id','nombre','rol','coordId','esJefe'];

let state = {
  tareas:[], personas:[], coordinaciones:[],
  tareasHeaders:[], personasHeaders:[],
  opciones:{},
  view:'dashboard', filterCoord:null, filterStatus:'all',
  filtroPeriodo:'todo', urlCoord:null,
  busqueda:''
};

// ── Leer parámetro URL al iniciar ──────────────────────────
function initUrlParams(){
  const params = new URLSearchParams(window.location.search);
  const coord = params.get('coord');
  if(coord){
    state.urlCoord = coord;
    // Si hay coord en URL, arrancar en vista de tareas filtrada
    state.filterCoord = coord;
    state.view = 'tareas';
  }
}

// ── Rol actual ─────────────────────────────────────────────
function esDirector(){ return !state.urlCoord; }
function coordActual(){ return state.urlCoord; }

// ── Color helpers ──────────────────────────────────────────
function coordColor(idx){ return PALETTE[idx % PALETTE.length]; }
function getCoordMeta(id){
  const idx = state.coordinaciones.findIndex(c=>String(c.id)===String(id));
  const coord = state.coordinaciones[idx];
  if(!coord) return {name:id||'Sin coordinación',icon:'📁',hex:'#888',bg:'rgba(136,136,136,.13)'};
  const color = coordColor(idx);
  return {name:coord.nombre,icon:coord.icon||'📁',hex:color.hex,bg:color.bg};
}

// ── Supabase config ────────────────────────────────────────
const SB_URL  = 'https://xqlxsbuyowthsyozvvkz.supabase.co';
const SB_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxbHhzYnV5b3d0aHN5b3p2dmt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MTYyNTMsImV4cCI6MjEwNjE5MjI1M30.y0mR8o2EUku_e5yosO4kiTnVyy04E3MtaygiSWZf-Oc';
const SB_HEADERS = {
  'Content-Type':  'application/json',
  'apikey':        SB_KEY,
  'Authorization': 'Bearer ' + SB_KEY,
  'Prefer':        'return=representation'
};

async function sbGet(table, params=''){
  const res = await fetch(`${SB_URL}/rest/v1/${table}?${params}`, {
    headers: { ...SB_HEADERS, 'Prefer': 'return=representation' }
  });
  if(!res.ok) throw new Error(`Error leyendo ${table}: ${res.statusText}`);
  return res.json();
}

async function sbPost(table, body){
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: SB_HEADERS,
    body: JSON.stringify(body)
  });
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.statusText); }
  return res.json();
}

async function sbPatch(table, id, body){
  const res = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'PATCH',
    headers: SB_HEADERS,
    body: JSON.stringify(body)
  });
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.statusText); }
  return res.json();
}

async function sbDelete(table, id){
  const res = await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${id}`, {
    method: 'DELETE',
    headers: SB_HEADERS
  });
  if(!res.ok){ const e=await res.json(); throw new Error(e.message||res.statusText); }
  return true;
}

// Normalizar campos de Supabase (snake_case → camelCase que usa el dashboard)
function normalizeTarea(t){
  return {
    id:                 t.id,
    titulo:             t.titulo,
    descripcion:        t.descripcion||'',
    coordId:            t.coord_id,
    asignado:           t.asignado||'',
    solicitante:        t.solicitante||'',
    tipo_requerimiento: t.tipo_requerimiento||'',
    categoria:          t.categoria||'',
    status:             t.status||'todo',
    prioridad:          t.prioridad||'media',
    fecha:              t.fecha||'',
    link:               t.link||'',
    created:            t.created_at||''
  };
}

function normalizePersona(p){
  return {
    id:       p.id,
    nombre:   p.nombre,
    rol:      p.rol||'',
    coordId:  p.coord_id,
    esJefe:   p.es_jefe===true||p.es_jefe==='true'?'true':'false'
  };
}

function normalizeCoord(c){
  return { id:c.id, nombre:c.nombre, icon:c.icon||'📁' };
}

function setSyncing(val){
  const dot=document.getElementById('sync-dot');
  const txt=document.getElementById('sync-text');
  if(dot) dot.className='sync-dot'+(val?' syncing':'');
  if(txt) txt.textContent=val?'Guardando…':'Sincronizado';
}

// ── loadData desde Supabase ────────────────────────────────
async function loadData(){
  initUrlParams();
  setSyncing(true);
  try{
    const [coords, personas, tareas, opcRows] = await Promise.all([
      sbGet('coordinaciones', 'order=created_at'),
      sbGet('personas',       'order=nombre'),
      sbGet('tareas',         'order=created_at.desc'),
      sbGet('opciones',       'order=tipo,orden')
    ]);

    state.coordinaciones = coords.map(normalizeCoord);
    state.personas       = personas.map(normalizePersona);
    state.tareas         = tareas.map(normalizeTarea);

    // Reconstruir opciones como {tipo_requerimiento:[...], categoria:[...]}
    state.opciones = {};
    opcRows.forEach(o=>{
      if(!state.opciones[o.tipo]) state.opciones[o.tipo]=[];
      state.opciones[o.tipo].push(o.valor);
    });

    // Headers dinámicos — con Supabase los campos son fijos, pero mantenemos
    // compatibilidad con el resto del código
    state.tareasHeaders   = ['id','titulo','descripcion','coordId','asignado','solicitante','tipo_requerimiento','categoria','status','prioridad','fecha','link','created'];
    state.personasHeaders = ['id','nombre','rol','coordId','esJefe'];

    renderSidebarCoords();
  } catch(e){
    showToast('Error al cargar datos: '+e.message);
    console.error(e);
  } finally { setSyncing(false); }
  document.getElementById('loading').style.display='none';
  render();
}

// ── Helpers ────────────────────────────────────────────────
function formatFecha(d){
  if(!d) return '—';
  try{
    const date = new Date(d);
    if(isNaN(date)) return String(d);
    return date.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'America/Santiago'});
  } catch(e){ return String(d); }
}
function statusLabel(s){ return {todo:'Por hacer',progress:'En progreso',review:'Revisión',done:'Completada'}[s]||s; }
function priorLabel(p){ return {alta:'Alta',media:'Media',baja:'Baja'}[p]||p; }
function getInitials(n){ return (n||'').split(' ').slice(0,2).map(w=>w[0]||'').join('').toUpperCase(); }
const AV=['#7F77DD','#378ADD','#1D9E75','#EF9F27','#D4537E','#D85A30'];
function avatarColor(n){ let h=0;for(let c of(n||''))h=(h*31+c.charCodeAt(0))%AV.length;return AV[h]; }
function tasksFor(id){ return state.tareas.filter(t=>String(t.coordId)===String(id)&&t.status!=='archivada'); }
function completedPct(id){ const t=tasksFor(id);if(!t.length)return 0;return Math.round(t.filter(x=>x.status==='done').length/t.length*100); }
function activeTareas(){ return state.tareas.filter(t=>t.status!=='archivada'); }
function showToast(msg){ const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),3000); }

// Campos extra (columnas del Sheet que no son del sistema)
function extraFields(headers, systemFields){
  return headers.filter(h => h && !systemFields.includes(h));
}

// ── Navigation ─────────────────────────────────────────────
function setView(v){
  state.view=v; state.filterCoord=null; state.filterStatus='all';
  document.querySelectorAll('.nav-item[id]').forEach(el=>el.classList.remove('active'));
  const a=document.getElementById('nav-'+v);
  if(a) a.classList.add('active');
  render();
}
function filterByCoord(id){ state.filterCoord=id; state.view='tareas'; render(); }

function renderSidebarCoords(){
  const el=document.getElementById('sidebar-coords');
  if(!el) return;

  // Actualizar rol en sidebar
  const rolEl = document.getElementById('sidebar-rol');
  if(rolEl){
    if(esDirector()){
      rolEl.textContent = 'Vista: Directora';
      rolEl.style.color = 'var(--purple)';
      rolEl.style.fontWeight = '500';
    } else {
      const m = getCoordMeta(state.urlCoord);
      rolEl.textContent = `Vista: ${m.icon} ${m.name}`;
      rolEl.style.color = 'var(--text-muted)';
    }
  }

  el.innerHTML = state.coordinaciones.map((c,i)=>{
    const color = coordColor(i);
    // Indicador: tareas en revisión de esta coordinación
    const enRevision = activeTareas().filter(t=>String(t.coordId)===String(c.id)&&t.status==='review').length;
    // Resaltar si es la coord del URL
    const esMia = state.urlCoord && String(state.urlCoord)===String(c.id);
    return `<button class="nav-item${esMia?' active':''}" onclick="filterByCoord('${c.id}')" style="${esMia?'':''}">
      <span class="coord-dot" style="background:${color.hex}"></span>
      <span style="flex:1;text-align:left">${c.nombre}</span>
      ${enRevision?`<span style="background:var(--amber-light);color:#633806;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;flex-shrink:0" title="${enRevision} tarea${enRevision>1?'s':''} esperando revisión">✓ ${enRevision}</span>`:''}
    </button>`;
  }).join('');
}

// ── Render ─────────────────────────────────────────────────
function render(){
  const el=document.getElementById('main-content');
  if(state.view==='dashboard')       el.innerHTML=renderDashboard();
  else if(state.view==='tareas')     el.innerHTML=renderTareasView();
  else if(state.view==='personas')   el.innerHTML=renderPersonasView();
  else if(state.view==='coordinaciones') el.innerHTML=renderCoordsView();
  else if(state.view==='opciones')       el.innerHTML=renderOpcionesView();
  else if(state.view==='papelera')       el.innerHTML=renderPapelera();
}

// ── Dashboard ──────────────────────────────────────────────
function renderDashboard(){
  const hoy = new Date();
  hoy.setHours(0,0,0,0);

  const periodo = state.filtroPeriodo || 'todo';
  let tareasBase = activeTareas();
  if(periodo==='semana'){
    const ini=new Date(hoy);ini.setDate(hoy.getDate()-hoy.getDay());
    tareasBase=tareasBase.filter(t=>{try{const d=new Date(t.created);return d>=ini&&d<=hoy;}catch(e){return false;}});
  } else if(periodo==='mes'){
    const ini=new Date(hoy.getFullYear(),hoy.getMonth(),1);
    tareasBase=tareasBase.filter(t=>{try{const d=new Date(t.created);return d>=ini&&d<=hoy;}catch(e){return false;}});
  }

  const total    = tareasBase.length;
  const done     = tareasBase.filter(t=>t.status==='done').length;
  const progress = tareasBase.filter(t=>t.status==='progress').length;
  const alta     = tareasBase.filter(t=>t.prioridad==='alta'&&t.status!=='done').length;

  const vencidas = activeTareas().filter(t=>{
    if(!t.fecha||t.status==='done') return false;
    try{ return new Date(t.fecha)<hoy; }catch(e){ return false; }
  });

  // Carga por persona
  const cargaMap={};
  tareasBase.filter(t=>t.asignado&&t.status!=='done').forEach(t=>{
    cargaMap[t.asignado]=(cargaMap[t.asignado]||0)+1;
  });
  const cargaTop=Object.entries(cargaMap).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const cargaMax=cargaTop.length?cargaTop[0][1]:1;

  const estados  = ['todo','progress','review','done'];
  const conteos  = estados.map(s=>tareasBase.filter(t=>t.status===s).length);
  const colores  = {todo:'#888780',progress:'#378ADD',review:'#EF9F27',done:'#639922'};

  // Dona distribución por ESTADO
  const donaEstadoHTML = ()=>{
    if(!total) return `<div class="empty" style="padding:24px"><p>Sin tareas en el período</p></div>`;
    const r=54,cx=70,cy=70,circum=2*Math.PI*r;
    let off=0;
    const slices=estados.map((s,i)=>{
      const dash=total?conteos[i]/total*circum:0;
      const sl=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colores[s]}" stroke-width="18"
        stroke-dasharray="${dash} ${circum-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" style="transition:all .4s"/>`;
      off+=dash; return sl;
    }).join('');
    const legend=estados.map((s,i)=>conteos[i]>0?`
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:5px">
        <span style="width:10px;height:10px;border-radius:50%;background:${colores[s]};flex-shrink:0"></span>
        <span style="color:var(--text-muted);flex:1">${statusLabel(s)}</span>
        <span style="font-weight:600">${conteos[i]}</span>
      </div>`:'').join('');
    return `<div style="display:flex;align-items:center;gap:20px;padding:12px 16px">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gray-light)" stroke-width="18"/>
        ${slices}
        <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="var(--text)">${total}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--text-faint)">tareas</text>
      </svg>
      <div style="flex:1">${legend}</div>
    </div>`;
  };

  // Dona distribución por COORDINACIÓN
  const donaCoordHTML = ()=>{
    const coordTotals = state.coordinaciones.map(c=>({
      c, m:getCoordMeta(c.id),
      cnt:tareasBase.filter(t=>String(t.coordId)===String(c.id)).length
    })).filter(x=>x.cnt>0);
    const grandTotal = coordTotals.reduce((s,x)=>s+x.cnt,0);
    if(!grandTotal) return `<div class="empty" style="padding:24px"><p>Sin tareas en el período</p></div>`;
    const r=54,cx=70,cy=70,circum=2*Math.PI*r;
    let off=0;
    const slices=coordTotals.map((x,i)=>{
      const dash=x.cnt/grandTotal*circum;
      const sl=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${x.m.hex}" stroke-width="18"
        stroke-dasharray="${dash} ${circum-dash}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})" style="transition:all .4s"/>`;
      off+=dash; return sl;
    }).join('');
    const legend=coordTotals.map(x=>`
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:5px;cursor:pointer" onclick="filterByCoord('${x.c.id}')">
        <span style="width:10px;height:10px;border-radius:50%;background:${x.m.hex};flex-shrink:0"></span>
        <span style="color:var(--text-muted);flex:1">${x.m.icon} ${x.m.name}</span>
        <span style="font-weight:600">${x.cnt}</span>
      </div>`).join('');
    return `<div style="display:flex;align-items:center;gap:20px;padding:12px 16px">
      <svg width="140" height="140" viewBox="0 0 140 140">
        <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--gray-light)" stroke-width="18"/>
        ${slices}
        <text x="${cx}" y="${cy}" text-anchor="middle" dominant-baseline="middle" font-size="18" font-weight="700" fill="var(--text)">${grandTotal}</text>
        <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10" fill="var(--text-faint)">tareas</text>
      </svg>
      <div style="flex:1">${legend}</div>
    </div>`;
  };

  return `
    <div class="topbar">
      <div><div class="page-title">Dashboard general</div>
      <div class="page-sub">${total} tareas activas · ${state.personas.length} personas · ${state.coordinaciones.length} coordinaciones</div></div>
      <div class="topbar-actions">
        <div style="display:flex;gap:4px;background:var(--gray-light);border-radius:var(--radius-sm);padding:3px">
          ${['todo','semana','mes'].map(p=>`<button onclick="state.filtroPeriodo='${p}';render()" style="padding:4px 12px;border-radius:4px;border:none;font-size:12px;cursor:pointer;font-family:inherit;background:${periodo===p?'var(--surface)':'transparent'};color:${periodo===p?'var(--text)':'var(--text-muted)'};font-weight:${periodo===p?'500':'400'}">${p==='todo'?'Todo':p==='semana'?'Esta semana':'Este mes'}</button>`).join('')}
        </div>
        <button class="btn" onclick="openModal('persona',null)">＋ Persona</button>
        <button class="btn btn-primary" onclick="openModal('tarea',null)">＋ Nueva tarea</button>
        <button class="btn" onclick="generarReporte()" style="background:#1a1a1a;color:#fff;border-color:#1a1a1a">📄 Generar reporte</button>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><div class="m-label">Total tareas</div><div class="m-value">${total}</div><div class="m-sub">período seleccionado</div></div>
      <div class="metric"><div class="m-label">Completadas</div><div class="m-value" style="color:var(--green)">${done}</div><div class="m-sub">${total?Math.round(done/total*100):0}% del total</div></div>
      <div class="metric"><div class="m-label">En progreso</div><div class="m-value" style="color:var(--blue)">${progress}</div><div class="m-sub">activas ahora</div></div>
      <div class="metric"><div class="m-label">Alta prioridad</div><div class="m-value" style="color:var(--red)">${alta}</div><div class="m-sub">pendientes</div></div>
      <div class="metric" style="cursor:${vencidas.length?'pointer':'default'};${vencidas.length?'border-color:var(--red);background:#FFFAFA':''}" onclick="${vencidas.length?'mostrarVencidas()':''}">
        <div class="m-label" style="${vencidas.length?'color:var(--red)':''}">⚠ Vencidas</div>
        <div class="m-value" style="color:${vencidas.length?'var(--red)':'var(--text-faint)'}">${vencidas.length}</div>
        <div class="m-sub" style="${vencidas.length?'color:var(--red)':''}">${vencidas.length?'clic para ver listado':'al día ✓'}</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:20px">
      <div class="section">
        <div class="section-header"><div class="section-title">📊 Por estado</div></div>
        ${donaEstadoHTML()}
      </div>
      <div class="section">
        <div class="section-header"><div class="section-title">🏢 Por coordinación</div></div>
        ${donaCoordHTML()}
      </div>
      <div class="section">
        <div class="section-header"><div class="section-title">👤 Carga por persona</div></div>
        ${cargaTop.length===0
          ? `<div class="empty" style="padding:24px"><p>Sin tareas asignadas</p></div>`
          : `<div style="padding:12px 16px">${cargaTop.map(([nombre,cnt])=>`
            <div style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                <span style="display:flex;align-items:center;gap:6px">
                  <span style="width:20px;height:20px;border-radius:50%;background:${avatarColor(nombre)}22;color:${avatarColor(nombre)};display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700">${getInitials(nombre)}</span>
                  ${nombre}
                </span>
                <span style="font-weight:600;color:var(--text)">${cnt}</span>
              </div>
              <div style="height:5px;background:var(--gray-light);border-radius:3px;overflow:hidden">
                <div style="height:100%;width:${Math.round(cnt/cargaMax*100)}%;background:${avatarColor(nombre)};border-radius:3px"></div>
              </div>
            </div>`).join('')}</div>`
        }
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div style="font-size:14px;font-weight:600">Coordinaciones</div>
      <button class="btn btn-sm btn-ghost" onclick="setView('coordinaciones')">Gestionar →</button>
    </div>
    <div class="cards-grid">
      ${state.coordinaciones.map((c)=>{
        const m=getCoordMeta(c.id);
        const pct=completedPct(c.id);
        const cnt=tasksFor(c.id).length;
        const pers=state.personas.filter(p=>String(p.coordId)===String(c.id)).length;
        const venc=vencidas.filter(t=>String(t.coordId)===String(c.id)).length;
        const jefe=state.personas.find(p=>String(p.coordId)===String(c.id)&&(p.esJefe==='true'||p.esJefe===true));
        return `<div class="coord-card" onclick="filterByCoord('${c.id}')">
          <div class="coord-card-header">
            <div class="coord-icon-wrap" style="background:${m.bg}">${m.icon}</div>
            <div style="flex:1"><div class="coord-card-name">${m.name}</div>
            <div class="coord-card-jefe">${jefe?jefe.nombre:'Sin jefe asignado'}</div></div>
            ${venc?`<span style="background:var(--red-light);color:var(--red);font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px">⚠ ${venc}</span>`:''}
          </div>
          <div class="coord-stats"><span>☑ ${cnt} tareas</span><span>👤 ${pers} personas</span></div>
          <div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${m.hex}"></div></div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">☑ Tareas recientes</div>

// Modal listado de vencidas
function mostrarVencidas(){
  const hoy=new Date();hoy.setHours(0,0,0,0);
  const vencidas=activeTareas().filter(t=>{
    if(!t.fecha||t.status==='done') return false;
    try{ return new Date(t.fecha)<hoy; }catch(e){ return false; }
  });
  document.getElementById('modal').style.display='flex';
  document.getElementById('modal-inner').innerHTML=`
    <div class="modal-header">
      <h2 style="color:var(--red)">⚠ Tareas vencidas (${vencidas.length})</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="padding:0">
      ${vencidas.length===0
        ? `<div class="empty"><div class="empty-icon">✅</div><p>No hay tareas vencidas</p></div>`
        : vencidas.map(t=>{
            const m=getCoordMeta(t.coordId);
            const diasStr=(()=>{
              try{
                const diff=Math.floor((hoy-new Date(t.fecha))/(1000*60*60*24));
                return `vencida hace ${diff} día${diff!==1?'s':''}`;
              }catch(e){return '';}
            })();
            return `<div class="task-item" style="border-bottom:1px solid var(--border)">
              <div class="task-status-dot" style="background:var(--red)"></div>
              <div class="task-body">
                <div class="task-title">${t.titulo||''}</div>
                <div class="task-meta">
                  <span>${m.icon} ${m.name}</span>
                  ${t.asignado?`<span>👤 ${t.asignado}</span>`:''}
                  <span style="color:var(--red);font-weight:500">📅 ${formatFecha(t.fecha)} · ${diasStr}</span>
                </div>
              </div>
              <button class="btn btn-sm btn-edit" onclick='closeModal();openModal("tarea",${JSON.stringify(t)})' title="Editar">✏</button>
            </div>`;
          }).join('')
      }
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cerrar</button>
      <button class="btn btn-primary" onclick="closeModal();setView('tareas')">Ver todas las tareas →</button>
    </div>`;
}

// ── HTML helpers ───────────────────────────────────────────
function taskListHTML(tasks){
  if(!tasks.length) return `<div class="empty"><div class="empty-icon">📋</div><p>Sin tareas aquí todavía</p></div>`;
  return tasks.map(t=>{
    const m=getCoordMeta(t.coordId);
    const hoy=new Date();hoy.setHours(0,0,0,0);
    const esVencida=t.fecha&&t.status!=='done'&&(()=>{try{return new Date(t.fecha)<hoy;}catch(e){return false;}})();
    const extras=extraFields(state.tareasHeaders,SYSTEM_FIELDS_TAREA)
      .filter(f=>t[f]!==undefined&&t[f]!=='')
      .map(f=>`<span>· ${f}: ${t[f]}</span>`).join('');
    return `<div class="task-item">
      <div class="task-status-dot dot-${t.status}" style="cursor:pointer" onclick='viewTask(${JSON.stringify(t)})'></div>
      <div class="task-body" style="cursor:pointer" onclick='viewTask(${JSON.stringify(t)})'>
        <div class="task-title task-title-link">${esVencida?'<span title="Tarea vencida" style="color:var(--red);margin-right:4px">⚠</span>':''}${t.titulo||''}</div>
        <div class="task-meta">
          <span>${m.icon} ${m.name}</span>
          ${t.solicitante?`<span>📋 ${t.solicitante}</span>`:'<span style="color:var(--text-faint)">Sin solicitante</span>'}
          ${t.asignado?`<span>👤 ${t.asignado}</span>`:'<span style="color:var(--text-faint)">Sin asignar</span>'}
          ${t.fecha?`<span>📅 ${formatFecha(t.fecha)}</span>`:'<span style="color:var(--text-faint)">Sin fecha</span>'}
        </div>
      </div>
      <span class="badge badge-${t.prioridad}">${priorLabel(t.prioridad)}</span>
      <select class="status-select" onchange="changeStatus('${t.id}',this.value)" onclick="event.stopPropagation()">
        ${['todo','progress','review','done'].map(s=>`<option value="${s}"${t.status===s?' selected':''}>${statusLabel(s)}</option>`).join('')}
      </select>
      <button class="btn btn-sm btn-view" onclick='viewTask(${JSON.stringify(t)})' title="Ver detalle">👁</button>
      <button class="btn btn-sm btn-edit" onclick='openModal("tarea",${JSON.stringify(t)})' title="Editar">✏</button>
      <button class="btn btn-sm btn-danger" onclick="archiveTask('${t.id}')" title="Archivar">🗑</button>
    </div>`;
  }).join('');
}

function personaListHTML(personas){
  if(!personas.length) return `<div class="empty" style="padding:20px"><p>Sin personas registradas</p></div>`;
  return personas.map(p=>{
    const col=avatarColor(p.nombre);
    const m=getCoordMeta(p.coordId);
    const esJefe=p.esJefe==='true'||p.esJefe===true;
    return `<div class="persona-item">
      <div class="avatar" style="background:${col}22;color:${col}">${getInitials(p.nombre)}</div>
      <div class="persona-info">
        <div class="persona-name">${p.nombre} ${esJefe?'<span class="badge" style="background:var(--purple-light);color:var(--purple-dark);font-size:10px">Jefe/a</span>':''}</div>
        <div class="persona-role">${p.rol||''}${m?' · '+m.name:''}</div>
      </div>
      <button class="btn btn-sm btn-edit" onclick='openModal("persona",${JSON.stringify(p)})' title="Editar">✏</button>
      <button class="btn btn-sm btn-danger" onclick="deletePersona('${p.id}')" title="Eliminar">✕</button>

function closeModal(){ document.getElementById('modal').style.display='none'; }
function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Actions ────────────────────────────────────────────────
async function submitTarea(existingId){
  const titulo=document.getElementById('f-titulo').value.trim();
  if(!titulo){ showToast('El título es obligatorio'); return; }

  const extras = extraFields(state.tareasHeaders, SYSTEM_FIELDS_TAREA);
  const extraData = {};
  extras.forEach(f=>{ const el=document.getElementById('f-extra-'+f); if(el) extraData[f]=el.value; });

  const body={
    titulo,
    descripcion:        document.getElementById('f-desc').value,
    coord_id:           document.getElementById('f-coord').value,
    solicitante:        document.getElementById('f-solicitante').value,
    tipo_requerimiento: document.getElementById('f-tipo_requerimiento').value,
    categoria:          document.getElementById('f-categoria').value,
    asignado:           document.getElementById('f-asig').value,
    prioridad:          document.getElementById('f-prior').value,
    status:             document.getElementById('f-status').value,
    fecha:              document.getElementById('f-fecha').value||null,
    link:               document.getElementById('f-link').value,
    ...extraData
  };

  closeModal();
  setSyncing(true);
  try{
    if(existingId){
      await sbPatch('tareas', existingId, body);
    } else {
      const id = 't' + Date.now();
      await sbPost('tareas', { id, ...body });
    }
    await loadData();
    showToast(existingId?'Tarea actualizada ✓':'Tarea agregada ✓');
  } catch(e){ showToast('Error: '+e.message); setSyncing(false); }
}

async function submitPersona(existingId){
  const nombre=document.getElementById('p-nombre').value.trim();
  if(!nombre){ showToast('El nombre es obligatorio'); return; }
  const body={
    nombre,
    rol:      document.getElementById('p-rol').value,
    coord_id: document.getElementById('p-coord').value,
    es_jefe:  document.getElementById('p-jefe').value==='true'
  };
  closeModal();
  setSyncing(true);
  try{
    if(existingId){ await sbPatch('personas', existingId, body); }
    else { await sbPost('personas', { id:'p'+Date.now(), ...body }); }
    await loadData();
    showToast(existingId?'Persona actualizada ✓':'Persona agregada ✓');
  } catch(e){ showToast('Error: '+e.message); setSyncing(false); }
}

async function submitCoord(){
  const id=document.getElementById('c-id').value.trim().replace(/\s+/g,'').toLowerCase();
  const nombre=document.getElementById('c-nombre').value.trim();
  if(!id||!nombre){ showToast('ID y nombre son obligatorios'); return; }
  if(state.coordinaciones.find(c=>c.id===id)){ showToast('Ya existe una coordinación con ese ID'); return; }
  const body={id,nombre,icon:document.getElementById('c-icon').value.trim()||'📁'};
  closeModal();
  setSyncing(true);
  try{ await sbPost('coordinaciones', body); await loadData(); showToast('Coordinación agregada ✓'); }
  catch(e){ showToast('Error: '+e.message); setSyncing(false); }
}

async function changeStatus(id,status){
  state.tareas=state.tareas.map(t=>t.id===id?{...t,status}:t);
  render();
  try{ await sbPatch('tareas', id, {status}); showToast('Estado actualizado ✓'); }
  catch(e){ showToast('Error al actualizar.'); await loadData(); }
}

async function deleteTask(id){
  if(!confirm('¿Eliminar esta tarea?')) return;
  state.tareas=state.tareas.filter(t=>t.id!==id);
  render();
  try{ await sbDelete('tareas', id); showToast('Tarea eliminada'); }
  catch(e){ showToast('Error.'); await loadData(); }
}

async function deletePersona(id){
  if(!confirm('¿Eliminar esta persona?')) return;
  state.personas=state.personas.filter(p=>p.id!==id);
  render();
  try{ await sbDelete('personas', id); showToast('Persona eliminada'); }
  catch(e){ showToast('Error.'); await loadData(); }
}

async function deleteCoord(id){
  if(!confirm('¿Eliminar esta coordinación? Las tareas y personas asociadas quedarán sin coordinación.')) return;
  state.coordinaciones=state.coordinaciones.filter(c=>c.id!==id);
  render();
  try{ await sbDelete('coordinaciones', id); await loadData(); showToast('Coordinación eliminada'); }
  catch(e){ showToast('Error.'); await loadData(); }
}

                  <span style="flex:1;font-size:13px">${v}</span>
                  <button class="btn btn-sm btn-danger" onclick="deleteOpcion('${tipo}','${v.replace(/'/g,"\\'")}')">✕</button>
                </div>`).join('')}
          </div>
          <div style="padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px">
            <input id="nueva-opcion-${tipo}" placeholder="Nueva opción…"
              style="flex:1;padding:7px 10px;border:1px solid var(--border-md);border-radius:var(--radius-sm);font-size:13px;font-family:inherit"
              onkeydown="if(event.key==='Enter')agregarOpcion('${tipo}')">
            <button class="btn btn-primary btn-sm" onclick="agregarOpcion('${tipo}')">＋ Agregar</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;

async function agregarOpcion(tipo){
  const input = document.getElementById(`nueva-opcion-${tipo}`);
  const valor = input.value.trim();
  if(!valor){ showToast('Escribe un valor primero'); return; }
  if((state.opciones[tipo]||[]).includes(valor)){ showToast('Esa opción ya existe'); return; }

  const orden = (state.opciones[tipo]||[]).length + 1;
  setSyncing(true);
  try{
    await sbPost('opciones', {tipo, valor, orden});
    if(!state.opciones[tipo]) state.opciones[tipo]=[];
    state.opciones[tipo].push(valor);
    input.value='';
    render();
    showToast('Opción agregada ✓');
  } catch(e){ showToast('Error: '+e.message); }
  finally{ setSyncing(false); }
}

async function deleteOpcion(tipo, valor){
  if(!confirm(`¿Eliminar "${valor}" de ${tipo}?`)) return;
  setSyncing(true);
  try{
    // Borrar por tipo+valor en Supabase
    const res = await fetch(
      `${SB_URL}/rest/v1/opciones?tipo=eq.${encodeURIComponent(tipo)}&valor=eq.${encodeURIComponent(valor)}`,
      { method:'DELETE', headers:SB_HEADERS }
    );
    if(!res.ok) throw new Error(res.statusText);
    state.opciones[tipo] = (state.opciones[tipo]||[]).filter(v=>v!==valor);
    render();
    showToast('Opción eliminada');
  } catch(e){ showToast('Error: '+e.message); }
  finally{ setSyncing(false); }
}

                </div>
              </div>
              <button class="btn btn-sm" onclick="restoreTask('${t.id}')" style="color:var(--green);border-color:transparent">↩ Restaurar</button>
              <button class="btn btn-sm btn-danger" onclick="deleteTaskPermanent('${t.id}')">✕ Eliminar</button>
            </div>`;
          }).join('')
      }
    </div>`;
}

async function archiveTask(id){
  state.tareas=state.tareas.map(t=>t.id===id?{...t,status:'archivada'}:t);
  render();
  try{
    await sbPatch('tareas', id, {status:'archivada'});
    showToast('Tarea archivada — puedes restaurarla desde la Papelera');
  } catch(e){ showToast('Error al archivar: '+e.message); }
}

async function restoreTask(id){
  state.tareas=state.tareas.map(t=>t.id===id?{...t,status:'todo'}:t);
  render();
  try{
    await sbPatch('tareas', id, {status:'todo'});
    showToast('Tarea restaurada ✓');
  } catch(e){ showToast('Error al restaurar: '+e.message); }
}

async function deleteTaskPermanent(id){
  if(!confirm('¿Eliminar definitivamente? Esta acción no se puede deshacer.')) return;
  state.tareas=state.tareas.filter(t=>t.id!==id);
  render();
  try{ await sbDelete('tareas', id); showToast('Tarea eliminada definitivamente'); }
  catch(e){ showToast('Error al eliminar.'); await loadData(); }
}

async function emptyTrash(){
  if(!confirm('¿Vaciar la papelera? Se eliminarán todas las tareas archivadas de forma permanente.')) return;
  const archivadas=state.tareas.filter(t=>t.status==='archivada');
  state.tareas=state.tareas.filter(t=>t.status!=='archivada');
  render();
  try{
    await Promise.all(archivadas.map(t=>sbDelete('tareas',t.id)));
    showToast('Papelera vaciada');
  } catch(e){ showToast('Error al vaciar papelera.'); await loadData(); }
}

// ── Generar Reporte PDF ────────────────────────────────────
function generarReporte(){
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const fechaStr = hoy.toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'});
  const periodo = state.filtroPeriodo || 'todo';
  const periodoStr = periodo==='semana'?'Esta semana':periodo==='mes'?'Este mes':'Todas las fechas';

  let tareasBase = activeTareas();
  if(periodo==='semana'){
    const ini=new Date(hoy);ini.setDate(hoy.getDate()-hoy.getDay());
    tareasBase=tareasBase.filter(t=>{try{const d=new Date(t.created);return d>=ini&&d<=hoy;}catch(e){return false;}});
  } else if(periodo==='mes'){
    const ini=new Date(hoy.getFullYear(),hoy.getMonth(),1);
    tareasBase=tareasBase.filter(t=>{try{const d=new Date(t.created);return d>=ini&&d<=hoy;}catch(e){return false;}});
  }

  const total    = tareasBase.length;
  const done     = tareasBase.filter(t=>t.status==='done').length;
  const progress = tareasBase.filter(t=>t.status==='progress').length;
  const review   = tareasBase.filter(t=>t.status==='review').length;
  const todo     = tareasBase.filter(t=>t.status==='todo').length;
  const alta     = tareasBase.filter(t=>t.prioridad==='alta'&&t.status!=='done').length;
  const vencidas = activeTareas().filter(t=>{
    if(!t.fecha||t.status==='done') return false;
    try{ return new Date(t.fecha)<hoy; }catch(e){ return false; }
  });

  const colores = {todo:'#888780',progress:'#378ADD',review:'#EF9F27',done:'#639922'};
  const estados = [{k:'todo',l:'Por hacer',v:todo},{k:'progress',l:'En progreso',v:progress},{k:'review',l:'En revisión',v:review},{k:'done',l:'Completadas',v:done}];

  // Carga por persona
  const cargaMap={};
  tareasBase.filter(t=>t.asignado&&t.status!=='done').forEach(t=>{ cargaMap[t.asignado]=(cargaMap[t.asignado]||0)+1; });
  const cargaTop=Object.entries(cargaMap).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const cargaMax=cargaTop.length?cargaTop[0][1]:1;

  // SVG dona distribución general
  const r=60,cx=80,cy=80,circum=2*Math.PI*r;
  let off=0;
  const donaSlices=estados.map(e=>{
    const pct=total?e.v/total:0;
    const dash=pct*circum;
    const gap=circum-dash;
    const s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${colores[e.k]}" stroke-width="22"
      stroke-dasharray="${dash} ${gap}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"/>`;
    off+=dash;
    return s;
  }).join('');

  // SVG barras apiladas por coordinación
  const barWidth = 340;
  const barH = 22;
  const barGap = 36;
  const coordBarsSVG = state.coordinaciones.map((c, i)=>{
    const m = getCoordMeta(c.id);
    const ct = tareasBase.filter(t=>String(t.coordId)===String(c.id));
    const ctTotal = ct.length || 1;
    let xOff = 0;
    const bars = estados.map(e=>{
      const cnt = ct.filter(t=>t.status===e.k).length;
      const w = Math.round((cnt/ctTotal)*barWidth);
      const bar = cnt>0 ? `<rect x="${xOff}" y="${i*barGap+16}" width="${w}" height="${barH}" fill="${colores[e.k]}" rx="2"/>
        <text x="${xOff+w/2}" y="${i*barGap+16+barH/2+4}" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">${cnt>0?cnt:''}</text>` : '';
      xOff+=w;
      return bar;
    }).join('');
    const pct = ct.length ? Math.round(ct.filter(t=>t.status==='done').length/ct.length*100) : 0;
    return `<text x="0" y="${i*barGap+12}" font-size="11" fill="#444" font-weight="500">${m.icon} ${m.name}</text>
      ${bars}
      <text x="${barWidth+8}" y="${i*barGap+16+barH/2+4}" font-size="10" fill="#639922" font-weight="700">${pct}%</text>`;
  }).join('');
  const svgBarHeight = state.coordinaciones.length * barGap + 10;

  // Filas tablas
  const vencidasRows = vencidas.slice(0,10).map(t=>{
    const m=getCoordMeta(t.coordId);
    return `<tr><td>${t.titulo||''}</td><td>${m.name}</td><td>${t.asignado||'—'}</td><td style="color:#E24B4A;font-weight:600">${formatFecha(t.fecha)}</td></tr>`;
  }).join('');

  const recientesRows = tareasBase.filter(t=>t.status==='done').slice(-8).reverse().map(t=>{
    const m=getCoordMeta(t.coordId);
    return `<tr><td>${t.titulo||''}</td><td>${m.name}</td><td>${t.asignado||'—'}</td></tr>`;
  }).join('');

  const coordRows = state.coordinaciones.map(c=>{
    const m=getCoordMeta(c.id);
    const ct=tareasBase.filter(t=>String(t.coordId)===String(c.id));
    const cdone=ct.filter(t=>t.status==='done').length;
    const cpct=ct.length?Math.round(cdone/ct.length*100):0;
    const jefe=state.personas.find(p=>String(p.coordId)===String(c.id)&&(p.esJefe==='true'||p.esJefe===true));
    const cvenc=vencidas.filter(t=>String(t.coordId)===String(c.id)).length;
    const color=cpct>=70?'#639922':cpct>=40?'#EF9F27':'#E24B4A';
    return `<tr>
      <td>${m.icon} ${m.name}</td>
      <td>${jefe?jefe.nombre:'—'}</td>
      <td style="text-align:center">${ct.length}</td>
      <td style="text-align:center">${cdone}</td>
      <td style="text-align:center;font-weight:700;color:${color}">${cpct}%</td>
      <td style="text-align:center;color:${cvenc?'#E24B4A':'#639922'};font-weight:600">${cvenc||'✓'}</td>
    </tr>`;
  }).join('');

  const reportHTML = `<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Reporte DIRCOM ${fechaStr}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#1a1a1a;background:#fff;font-size:13px}
  .page{padding:0}
  /* Header */
  .header{background:linear-gradient(135deg,#7F77DD 0%,#534AB7 100%);color:#fff;padding:32px 40px 24px}
  .header .org{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:6px}
  .header h1{font-size:24px;font-weight:700;margin-bottom:4px}
  .header .sub{font-size:13px;opacity:.85}
  .header .fecha{font-size:11px;opacity:.65;margin-top:8px}
  .stripe{height:5px;background:linear-gradient(90deg,#EF9F27,#E24B4A,#7F77DD,#1D9E75)}
  /* Sections */
  .section{padding:24px 40px}
  .section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#888;margin-bottom:10px}
  .intro{font-size:12px;color:#555;line-height:1.8;margin-bottom:20px;background:#F8F8F6;border-left:4px solid #7F77DD;padding:12px 16px;border-radius:0 6px 6px 0}
  /* Métricas */
  .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:4px}
  .metric{background:#F8F8F6;border-radius:8px;padding:12px;border-top:3px solid var(--c)}
  .metric .ml{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:4px}
  .metric .mv{font-size:26px;font-weight:800;color:var(--c);line-height:1}
  .metric .ms{font-size:9px;color:#999;margin-top:3px}
  /* Dos columnas */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#F8F8F6;border-radius:8px;padding:16px}
  .card-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:8px}
  .card-desc{font-size:10px;color:#999;line-height:1.5;margin-bottom:12px}
  /* Tablas */
  table{width:100%;border-collapse:collapse;font-size:11px}
  th{background:#EEEDFE;color:#534AB7;font-weight:700;padding:7px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
  td{padding:6px 10px;border-bottom:1px solid #eee}
  tr:last-child td{border-bottom:none}
  .table-red th{background:#FCEBEB;color:#791F1F}
  .table-green th{background:#EAF3DE;color:#27500A}
  /* Vencidas alert */
  .alert-red{border:1px solid #FCEBEB;border-radius:8px;overflow:hidden}
  .alert-green{border:1px solid #EAF3DE;border-radius:8px;overflow:hidden}
  .section-border{border:1px solid #eee;border-radius:8px;overflow:hidden}
  /* Pie */
  .footer{background:#F1EFE8;padding:12px 40px;display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .footer span{font-size:10px;color:#aaa}
  /* Barras carga */
  .bar-wrap{margin-bottom:8px}
  .bar-label{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
  .bar-track{height:7px;background:#E0E0DB;border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;background:#7F77DD}
  @media print{
    body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .no-print{display:none}
  }
</style>
</head>
<body>
<div class="page">

      ${vencidas.length

  const win = window.open('','_blank');

// ── Vista detallada de tarea ───────────────────────────────
function viewTask(t){
  const m = getCoordMeta(t.coordId);
  const extras = extraFields(state.tareasHeaders, SYSTEM_FIELDS_TAREA);

  const statusColors = {
    todo:     {bg:'var(--gray-light)',    color:'#444'},
    progress: {bg:'rgba(55,138,221,.13)',color:'#0C447C'},
    review:   {bg:'var(--amber-light)',   color:'#633806'},
    done:     {bg:'var(--green-light)',   color:'#27500A'}
  };
  const sc = statusColors[t.status] || statusColors.todo;

  const formatDate = (d) => {
    if(!d) return '<span style="color:var(--text-faint)">—</span>';
    try{ return new Date(d).toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'}); }
    catch(e){ return escHtml(String(d)); }

  const field = (label, value) => `
    <div class="detail-field">
      <div class="d-label">${label}</div>
      <div class="d-value">${value}</div>
    </div>`;

  const extrasHTML = extras
    .filter(f => t[f] !== undefined && String(t[f]).trim() !== '')
    .map(f => field(f, escHtml(String(t[f]))))
    .join('');

  document.getElementById('modal').style.display='flex';
  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-header">
      <h2>Detalle de tarea</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="task-detail-header">
        <div class="task-detail-icon" style="background:${m.bg}">${m.icon}</div>
        <div>
          <div class="task-detail-title">${escHtml(t.titulo||'Sin título')}</div>
          <div class="task-detail-coord">${m.name}</div>
        </div>
      </div>
      <div class="detail-grid">
        ${field('Estado', `<span style="display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:4px;background:${sc.bg};color:${sc.color};font-size:12px;font-weight:500"><span style="width:7px;height:7px;border-radius:50%;background:${sc.color};display:inline-block"></span>${statusLabel(t.status)}</span>`)}
        ${field('Prioridad', `<span class="badge badge-${t.prioridad}">${priorLabel(t.prioridad)}</span>`)}
        ${field('Solicitante', t.solicitante ? escHtml(String(t.solicitante)) : '<span style="color:var(--text-faint)">—</span>')}
        ${field('Tipo de requerimiento', t.tipo_requerimiento ? escHtml(String(t.tipo_requerimiento)) : '<span style="color:var(--text-faint)">—</span>')}
        ${field('Categoría', t.categoria ? escHtml(String(t.categoria)) : '<span style="color:var(--text-faint)">—</span>')}
        ${field('Fecha de creación', formatDate(t.created))}
        ${field('Fecha límite', t.fecha ? `📅 ${formatFecha(t.fecha)}` : '<span style="color:var(--text-faint)">Sin fecha</span>')}
        ${field('Asignado a', t.asignado
          ? `<span style="display:flex;align-items:center;gap:6px"><span style="width:22px;height:22px;border-radius:50%;background:${avatarColor(t.asignado)}22;color:${avatarColor(t.asignado)};display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:600">${getInitials(t.asignado)}</span>${escHtml(t.asignado)}</span>`
          : '<span style="color:var(--text-faint)">Sin asignar</span>')}

      ${t.descripcion ? `<div class="detail-desc"><div class="d-label">Descripción</div><div class="d-value">${escHtml(String(t.descripcion))}</div></div>` : ''}
      ${t.link ? `<div class="detail-desc"><div class="d-label">Link</div><div class="d-value"><a href="${escHtml(String(t.link))}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:underline;word-break:break-all">${escHtml(String(t.link))}</a></div></div>` : ''}
      ${extrasHTML ? `<div class="detail-grid" style="margin-top:10px">${extrasHTML}</div>` : ''}
    </div>
    <div class="modal-footer">

}

// ── Buscador sidebar ───────────────────────────────────────
function onSidebarSearch(q){
  const clearBtn = document.getElementById('search-clear');
  const resultsEl = document.getElementById('sidebar-search-results');
  if(clearBtn) clearBtn.style.display = q ? 'block' : 'none';

  if(!q.trim()){
    if(resultsEl) resultsEl.style.display='none';
    return;
  }

  const lower = q.toLowerCase();
  const matches = activeTareas().filter(t=>
    (t.titulo||'').toLowerCase().includes(lower)||
    (t.solicitante||'').toLowerCase().includes(lower)||
    (t.asignado||'').toLowerCase().includes(lower)||
    (t.descripcion||'').toLowerCase().includes(lower)
  ).slice(0,8);

  if(!resultsEl) return;

  if(!matches.length){
    resultsEl.style.display='block';
    resultsEl.innerHTML=`<div style="padding:12px 14px;font-size:12px;color:var(--text-muted)">Sin resultados para "${q}"</div>`;
    return;
  }

  resultsEl.style.display='block';
  resultsEl.innerHTML = matches.map(t=>{
    const m=getCoordMeta(t.coordId);
    const hoy=new Date();hoy.setHours(0,0,0,0);
    const vencida=t.fecha&&t.status!=='done'&&(()=>{try{return new Date(t.fecha)<hoy;}catch(e){return false;}})();
    return `<div onclick='viewTask(${JSON.stringify(t)});document.getElementById("sidebar-search").value="";onSidebarSearch("")'
      style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s"
      onmouseover="this.style.background='var(--gray-light)'" onmouseout="this.style.background='transparent'">
      <div style="font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
        ${vencida?'<span style="color:var(--red)">⚠</span> ':''}${t.titulo||''}
      </div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px;display:flex;gap:8px">
        <span>${m.icon} ${m.name}</span>
        ${t.asignado?`<span>👤 ${t.asignado}</span>`:''}
        <span class="badge badge-${t.prioridad}" style="font-size:10px;padding:1px 6px">${priorLabel(t.prioridad)}</span>
      </div>
    </div>`;
  }).join('');
}

// ── Auto-refresh silencioso ────────────────────────────────
let autoRefreshInterval = null;
const REFRESH_INTERVAL = 2 * 60 * 1000; // 2 minutos

async function silentRefresh(){
  if(document.getElementById('modal').style.display==='flex') return;
  try{
    const [coords, personas, tareas, opcRows] = await Promise.all([
      sbGet('coordinaciones', 'order=created_at'),
      sbGet('personas',       'order=nombre'),
      sbGet('tareas',         'order=created_at.desc'),
      sbGet('opciones',       'order=tipo,orden')
    ]);
    state.coordinaciones = coords.map(normalizeCoord);
    state.personas       = personas.map(normalizePersona);
    state.tareas         = tareas.map(normalizeTarea);
    state.opciones = {};
    opcRows.forEach(o=>{ if(!state.opciones[o.tipo]) state.opciones[o.tipo]=[]; state.opciones[o.tipo].push(o.valor); });
    renderSidebarCoords();
    render();
    const txt=document.getElementById('sync-text');
    const now=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
    if(txt) txt.textContent=`Actualizado ${now}`;
  } catch(e){ /* fallo silencioso */ }
}

function startAutoRefresh(){
  if(autoRefreshInterval) clearInterval(autoRefreshInterval);
  autoRefreshInterval = setInterval(silentRefresh, REFRESH_INTERVAL);
}

loadData().then(()=>startAutoRefresh());
</script>
