<!DOCTYPE html>
<!--
  Dashboard DIRCOM UFRO
  Versión: 2.5.0
  Fecha: 2026-10-07
  Changelog:
  - v2.5.0: Vista mobile con menú ☰; altas de personas, coordinaciones y opciones solo para la directora; el buscador de tareas mantiene el foco
  - v2.4.0: Vista de la directora protegida con clave (DIRECTORA_KEY); Reportes solo para la directora; cada coordinación recibe solo sus tareas
  - v2.3.0: Vista Reportes — período configurable, KPIs, comparación, PDF y exportación a Excel; registro de fecha de término
  - v2.2.0: Código separado en archivos (css/, js/, img/) — sin cambios de funcionalidad
  - v2.1.2: Celdas del calendario con tamaño fijo (no se expanden con el contenido)
  - v2.1.1: Favicon agregado
  - v2.1.0: Vista de calendario — tareas y carga por persona organizadas por día/semana/mes
  - v2.0.0: Migración a Supabase + Vercel serverless (credenciales protegidas)
  - v1.5.0: Buscador, ordenamiento, vista Opciones
  - v1.4.0: Papelera/archivado, URLs por coordinación
  - v1.3.0: Migración Google Sheets → Supabase
  - v1.0.0: MVP inicial con Google Sheets + Apps Script
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Dirección de Comunicaciones</title>
<link rel="icon" type="image/webp" href="img/favicon.webp">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p>Cargando datos…</p>
</div>

<header class="mobile-bar">
  <button class="menu-btn" onclick="toggleMenu()" aria-label="Abrir menú">☰</button>
  <span class="mobile-bar-title">Comunicaciones</span>
</header>
<div class="sidebar-backdrop" onclick="toggleMenu(false)"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="org">Universidad de La Frontera</div>
    <div class="name">Comunicaciones</div>
    <div class="sub" id="sidebar-rol">Panel de gestión</div>
  </div>
  <div style="padding:10px 12px 0">
    <div style="position:relative">
      <input id="sidebar-search" type="text" placeholder="Buscar tarea…"
        style="width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border-md);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg);color:var(--text)"
        oninput="onSidebarSearch(this.value)"
        onkeydown="if(event.key==='Escape'){this.value='';onSidebarSearch('')}">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none">🔍</span>
      <button id="search-clear" onclick="document.getElementById('sidebar-search').value='';onSidebarSearch('')"
        style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text-muted)">✕</button>
    </div>
    <div id="sidebar-search-results" style="display:none;margin-top:6px;max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow)"></div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-label">Vistas</div>
    <button class="nav-item active" id="nav-dashboard" onclick="setView('dashboard')"><span class="icon">⊞</span> Dashboard general</button>
    <button class="nav-item" id="nav-tareas" onclick="setView('tareas')"><span class="icon">☑</span> Todas las tareas</button>
    <button class="nav-item" id="nav-personas" onclick="setView('personas')"><span class="icon">👥</span> Equipo</button>
    <button class="nav-item" id="nav-coordinaciones" onclick="setView('coordinaciones')"><span class="icon">⚙</span> Coordinaciones</button>
    <button class="nav-item" id="nav-calendario" onclick="setView('calendario')"><span class="icon">📅</span> Calendario</button>
    <button class="nav-item" id="nav-reportes" style="display:none" onclick="setView('reportes')"><span class="icon">📈</span> Reportes</button>
    <button class="nav-item" id="nav-opciones" onclick="setView('opciones')"><span class="icon">🏷</span> Opciones</button>
    <button class="nav-item" id="nav-papelera" onclick="setView('papelera')"><span class="icon">🗑</span> Papelera</button>
    <div class="nav-divider"></div>
    <div class="nav-label">Coordinaciones</div>
    <div id="sidebar-coords"></div>
    <div class="nav-divider"></div>
    <button class="nav-item" onclick="openModal('tarea',null)"><span class="icon">＋</span> Nueva tarea</button>
    <button class="nav-item" id="sidebar-add-persona" style="display:none" onclick="openModal('persona',null)"><span class="icon">＋</span> Agregar persona</button>
  </div>
  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-text">Sincronizado</span>
    <button onclick="silentRefresh()" title="Actualizar ahora" style="margin-left:auto;border:none;background:transparent;cursor:pointer;font-size:14px;padding:0;color:var(--text-faint)" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-faint)'">↻</button>
  </div>
</nav>

<main class="main" id="main-content"></main>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>
<div class="toast" id="toast"></div>

<!-- Scripts clásicos (no módulos): comparten el ámbito global para que los
     onclick="..." del HTML generado sigan funcionando. El orden importa. -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/metricas.js"></script>
<script src="js/components/listas.js"></script>
<script src="js/components/modales.js"></script>
<script src="js/components/buscador.js"></script>
<script src="js/components/tablas.js"></script>
<script src="js/views/dashboard.js"></script>
<script src="js/views/tareas.js"></script>
<script src="js/views/personas.js"></script>
<script src="js/views/coordinaciones.js"></script>
<script src="js/views/calendario.js"></script>
<script src="js/views/opciones.js"></script>
<script src="js/views/papelera.js"></script>
<script src="js/views/reportes.js"></script>
<script src="js/reporte.js"></script>
<script src="js/exportar.js"></script>
<script src="js/acciones.js"></script>
<script src="js/app.js"></script>
<script src="js/main.js"></script>
</body>
</html>
