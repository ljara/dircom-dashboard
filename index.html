<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Dirección de Comunicaciones</title>
<style>
  :root {
    --purple:#7F77DD;--purple-dark:#534AB7;--purple-light:#EEEDFE;
    --blue:#378ADD;--amber:#EF9F27;--red:#E24B4A;--green:#639922;--gray:#888780;
    --red-light:#FCEBEB;--amber-light:#FAEEDA;--green-light:#EAF3DE;--gray-light:#F1EFE8;--blue-light:#E6F1FB;
    --bg:#F8F8F6;--surface:#FFFFFF;
    --border:rgba(0,0,0,0.09);--border-md:rgba(0,0,0,0.16);
    --text:#1a1a1a;--text-muted:#666;--text-faint:#999;
    --radius:10px;--radius-sm:6px;--shadow:0 1px 3px rgba(0,0,0,0.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  /* Sidebar */
  .sidebar{position:fixed;top:0;left:0;width:224px;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:10}
  .sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
  .sidebar-logo .org{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px}
  .sidebar-logo .name{font-size:15px;font-weight:600}
  .sidebar-logo .sub{font-size:12px;color:var(--text-muted)}
  .sidebar-nav{padding:12px 10px;flex:1;overflow-y:auto}
  .nav-label{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-faint);padding:6px 8px 4px}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;color:var(--text-muted);border:none;background:transparent;width:100%;text-align:left;transition:background .12s}
  .nav-item:hover{background:var(--gray-light);color:var(--text)}
  .nav-item.active{background:var(--purple-light);color:var(--purple-dark);font-weight:500}
  .nav-item .icon{font-size:15px;width:20px;text-align:center}
  .nav-divider{height:1px;background:var(--border);margin:8px 0}
  .coord-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sync-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-faint);padding:0 18px 14px}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}
  .sync-dot.syncing{background:var(--amber);animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  /* Main */
  .main{margin-left:224px;padding:28px 28px 40px;min-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:12px;flex-wrap:wrap}
  .page-title{font-size:20px;font-weight:600}
  .page-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
  /* Buttons */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-md);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;transition:background .12s;white-space:nowrap}
  .btn:hover{background:var(--gray-light)}
  .btn-primary{background:var(--purple);border-color:var(--purple);color:#fff}
  .btn-primary:hover{background:var(--purple-dark);border-color:var(--purple-dark)}
  .btn-sm{padding:4px 10px;font-size:12px}
  .btn-ghost{border-color:transparent;background:transparent;color:var(--text-muted)}
  .btn-ghost:hover{background:var(--gray-light);color:var(--text)}
  .btn-danger{color:var(--red);border-color:transparent;background:transparent}
  .btn-danger:hover{background:var(--red-light)}
  .btn-edit{color:var(--purple);border-color:transparent;background:transparent}
  .btn-edit:hover{background:var(--purple-light)}
  .btn-view{color:var(--blue);border-color:transparent;background:transparent}
  .btn-view:hover{background:rgba(55,138,221,.1)}
  /* Vista detallada de tarea */
  .task-detail-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:20px}
  .task-detail-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .task-detail-title{font-size:17px;font-weight:600;line-height:1.3;margin-bottom:6px}
  .task-detail-coord{font-size:13px;color:var(--text-muted)}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .detail-field{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px}
  .detail-field .d-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:4px}
  .detail-field .d-value{font-size:13px;font-weight:500;color:var(--text)}
  .detail-desc{background:var(--bg);border-radius:var(--radius-sm);padding:12px;margin-bottom:16px}
  .detail-desc .d-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:6px}
  .detail-desc .d-value{font-size:13px;color:var(--text);line-height:1.6}
  .detail-extras{margin-top:4px}
  .detail-extras .d-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin-bottom:8px}
  .task-title-link{cursor:pointer;text-decoration:none;color:inherit}
  .task-title-link:hover{color:var(--purple);text-decoration:underline}
  /* Metrics */
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
  .metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .metric .m-label{font-size:11px;color:var(--text-faint);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  .metric .m-value{font-size:26px;font-weight:700;line-height:1}
  .metric .m-sub{font-size:11px;color:var(--text-muted);margin-top:4px}
  /* Cards */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:24px}
  .coord-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s,box-shadow .15s}
  .coord-card:hover{border-color:var(--border-md);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
  .coord-card.active{border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
  .coord-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .coord-icon-wrap{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .coord-card-name{font-size:13px;font-weight:600}
  .coord-card-jefe{font-size:11px;color:var(--text-muted);margin-top:1px}
  .coord-stats{display:flex;gap:14px;font-size:12px;color:var(--text-muted);margin-bottom:10px}
  .prog-bar{height:4px;background:var(--gray-light);border-radius:2px;overflow:hidden}
  .prog-fill{height:100%;border-radius:2px;transition:width .4s ease}
  .prog-pct{font-size:11px;color:var(--text-faint);margin-top:4px;text-align:right}
  /* Layout */
  .two-col{display:grid;grid-template-columns:1fr 320px;gap:20px;align-items:start}
  .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .section-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
  .section-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
  /* Filters */
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
  .filter-pill{padding:4px 12px;border-radius:20px;border:1px solid var(--border-md);background:transparent;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .12s}
  .filter-pill:hover{border-color:var(--purple);color:var(--purple)}
  .filter-pill.active{background:var(--purple-light);border-color:var(--purple);color:var(--purple-dark);font-weight:500}
  /* Tasks */
  .task-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;transition:background .1s}
  .task-item:hover{background:var(--gray-light)}
  .task-item+.task-item{border-top:1px solid var(--border)}
  .task-status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px}
  .task-body{flex:1;min-width:0}
  .task-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .task-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .status-select{font-size:11px;border:1px solid var(--border-md);border-radius:4px;padding:2px 6px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit}
  /* Badges */
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
  .badge-alta{background:var(--red-light);color:#791F1F}
  .badge-media{background:var(--amber-light);color:#633806}
  .badge-baja{background:var(--green-light);color:#27500A}
  .dot-todo{background:var(--gray)}.dot-progress{background:var(--blue)}.dot-review{background:var(--amber)}.dot-done{background:var(--green)}
  /* Personas */
  .persona-item{display:flex;align-items:center;gap:10px;padding:9px 12px}
  .persona-item+.persona-item{border-top:1px solid var(--border)}
  .persona-item:hover{background:var(--gray-light)}
  .avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
  .persona-info{flex:1;min-width:0}
  .persona-name{font-size:13px;font-weight:500}
  .persona-role{font-size:11px;color:var(--text-muted)}
  /* Empty */
  .empty{text-align:center;padding:36px 20px;color:var(--text-muted)}
  .empty .empty-icon{font-size:32px;margin-bottom:10px}
  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);width:460px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.18)}
  .modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
  .modal-header h2{font-size:16px;font-weight:600}
  .modal-body{padding:20px}
  .modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg)}
  .form-group{margin-bottom:14px}
  .form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-muted);margin-bottom:5px;text-transform:capitalize}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border-md);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:13px;font-family:inherit}
  .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,119,221,.12)}
  .form-group textarea{resize:vertical;min-height:68px}
  .field-extra{background:var(--gray-light);border-radius:var(--radius-sm);padding:2px 0;margin-bottom:2px}
  .field-extra label{color:var(--text-faint);font-style:italic}
  /* Toast & Spinner */
  .toast{position:fixed;bottom:24px;right:24px;background:#1a1a1a;color:#fff;padding:10px 18px;border-radius:var(--radius-sm);font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  .loading-overlay{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:200}
  .loading-overlay p{font-size:14px;color:var(--text-muted)}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:900px){.sidebar{display:none}.main{margin-left:0;padding:16px}.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="loading-overlay" id="loading">
  <div class="spinner"></div>
  <p>Cargando datos desde Google Sheets…</p>
</div>

<nav class="sidebar">
  <div class="sidebar-logo">
    <div class="org">Universidad de La Frontera</div>
    <div class="name">Comunicaciones</div>
    <div class="sub" id="sidebar-rol">Panel de gestión</div>
  </div>
  <div style="padding:10px 12px 0">
    <div style="position:relative">
      <input id="sidebar-search" type="text" placeholder="Buscar tarea…"
        style="width:100%;padding:7px 10px 7px 32px;border:1px solid var(--border-md);border-radius:var(--radius-sm);font-size:12px;font-family:inherit;background:var(--bg);color:var(--text)"
        oninput="onSidebarSearch(this.value)"
        onkeydown="if(event.key==='Escape'){this.value='';onSidebarSearch('')}">
      <span style="position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none">🔍</span>
      <button id="search-clear" onclick="document.getElementById('sidebar-search').value='';onSidebarSearch('')"
        style="display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text-muted)">✕</button>
    </div>
    <div id="sidebar-search-results" style="display:none;margin-top:6px;max-height:240px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow)"></div>
  </div>
  <div class="sidebar-nav">
    <div class="nav-label">Vistas</div>
    <button class="nav-item active" id="nav-dashboard" onclick="setView('dashboard')"><span class="icon">⊞</span> Dashboard general</button>
    <button class="nav-item" id="nav-tareas" onclick="setView('tareas')"><span class="icon">☑</span> Todas las tareas</button>
    <button class="nav-item" id="nav-personas" onclick="setView('personas')"><span class="icon">👥</span> Equipo</button>
    <button class="nav-item" id="nav-coordinaciones" onclick="setView('coordinaciones')"><span class="icon">⚙</span> Coordinaciones</button>
    <button class="nav-item" id="nav-opciones" onclick="setView('opciones')"><span class="icon">🏷</span> Opciones</button>
    <button class="nav-item" id="nav-papelera" onclick="setView('papelera')"><span class="icon">🗑</span> Papelera</button>
    <div class="nav-divider"></div>
    <div class="nav-label">Coordinaciones</div>
    <div id="sidebar-coords"></div>
    <div class="nav-divider"></div>
    <button class="nav-item" onclick="openModal('tarea',null)"><span class="icon">＋</span> Nueva tarea</button>
    <button class="nav-item" onclick="openModal('persona',null)"><span class="icon">＋</span> Agregar persona</button>
  </div>
  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-text">Sincronizado</span>
    <button onclick="silentRefresh()" title="Actualizar ahora" style="margin-left:auto;border:none;background:transparent;cursor:pointer;font-size:14px;padding:0;color:var(--text-faint)" onmouseover="this.style.color='var(--purple)'" onmouseout="this.style.color='var(--text-faint)'">↻</button>
  </div>
</nav>

<main class="main" id="main-content"></main>
<div class="modal-backdrop" id="modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal-inner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxGEYGNKU-vJg8R5SUsp1CpGdmWAVFSTW-CC2qekUujJPbEOP1V_UCzZLc_3WJ5_tmW/exec';

const PALETTE = [
  {hex:'#378ADD',bg:'rgba(55,138,221,.13)'},
  {hex:'#7F77DD',bg:'rgba(127,119,221,.13)'},
  {hex:'#1D9E75',bg:'rgba(29,158,117,.13)'},
  {hex:'#EF9F27',bg:'rgba(239,159,39,.13)'},
  {hex:'#D4537E',bg:'rgba(212,83,126,.13)'},
  {hex:'#D85A30',bg:'rgba(216,90,48,.13)'},
  {hex:'#5B8FA8',bg:'rgba(91,143,168,.13)'},
  {hex:'#7A9E3B',bg:'rgba(122,158,59,.13)'},
];

// Campos del sistema que no se muestran como campos extra editables
const SYSTEM_FIELDS_TAREA   = ['id','titulo','descripcion','coordId','asignado','status','prioridad','fecha','created','solicitante','tipo_requerimiento','categoria','link'];
const SYSTEM_FIELDS_PERSONA = ['id','nombre','rol','coordId','esJefe'];

let state = {
  tareas:[], personas:[], coordinaciones:[],
  tareasHeaders:[], personasHeaders:[],
  opciones:{},
  view:'dashboard', filterCoord:null, filterStatus:'all',
  filtroPeriodo:'todo', urlCoord:null,
  busqueda:'', ordenTareas:'created_desc'
};

// ── Leer parámetro URL al iniciar ──────────────────────────
function initUrlParams(){
  const params = new URLSearchParams(window.location.search);
  const coord = params.get('coord');
  if(coord){
    state.urlCoord = coord;
    // Si hay coord en URL, arrancar en vista de tareas filtrada
    state.filterCoord = coord;
    state.view = 'tareas';
  }
}

// ── Rol actual ─────────────────────────────────────────────
function esDirector(){ return !state.urlCoord; }
function coordActual(){ return state.urlCoord; }

// ── Color helpers ──────────────────────────────────────────
function coordColor(idx){ return PALETTE[idx % PALETTE.length]; }
function getCoordMeta(id){
  const idx = state.coordinaciones.findIndex(c=>String(c.id)===String(id));
  const coord = state.coordinaciones[idx];
  if(!coord) return {name:id||'Sin coordinación',icon:'📁',hex:'#888',bg:'rgba(136,136,136,.13)'};
  const color = coordColor(idx);
  return {name:coord.nombre,icon:coord.icon||'📁',hex:color.hex,bg:color.bg};
}

// ── API — llama a Vercel Function (credenciales en servidor) ──
const API_BASE = '/api/data';
// ── Cliente API centralizado ──────────────────────────────
async function callAPI(action, data) {
  setSyncing(true);
  try {
    const res = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, data })
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error);
    return json;
  } finally { setSyncing(false); }
}

async function sbGet(table, params) { return callAPI('_raw_get', { table, params }); }
